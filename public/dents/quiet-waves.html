<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="author" content="Booplio"><meta name="license" content="CC0-1.0"><title>Quiet Waves</title>
<style>
:root{--accent:#78dbef;--progress:.64}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent;color:var(--accent);font-family:system-ui,sans-serif}body{display:flex;align-items:center;justify-content:center}.design{width:85%;height:80%;position:relative;display:flex;align-items:center;justify-content:center;gap:7px;flex-direction:column}.visual{position:relative;display:flex;align-items:center;justify-content:center;width:42px;height:100px;max-height:70%}.value{font-size:clamp(10px,16vw,15px);font-weight:600;letter-spacing:-.5px;white-space:nowrap}.liquid{width:25px;height:100%;background:#ffffff12;border-radius:99px;overflow:hidden;position:relative}.fill{position:absolute;bottom:0;width:100%;height:calc(var(--progress) * 100%);background:linear-gradient(20deg,var(--accent),color-mix(in srgb,var(--accent),transparent 30%));border-radius:50% 50% 9px 9px;transition:height .2s}.bubble{position:absolute;border-radius:50%;width:7px;height:7px;border:1px solid #fff6;top:30%;left:7px;animation:bubble 3s ease-in-out infinite}.bubble:nth-child(2){width:4px;height:4px;top:70%;left:15px;animation-delay:-1s}.bars{display:flex;align-items:center;gap:3px;width:100%;height:80%}.bars i{background:var(--accent);height:calc(20% + var(--progress) * 75%);width:5px;border-radius:99px;transform:scaleY(.6);animation:wave 2s ease-in-out infinite}.bars i:nth-child(2){animation-delay:-.4s;transform:scaleY(.85)}.bars i:nth-child(3){animation-delay:-.8s;transform:scaleY(1)}.bars i:nth-child(4){animation-delay:-1.2s}.bars i:nth-child(5){animation-delay:-1.6s}.sun{width:28px;height:28px;border:2px solid var(--accent);border-radius:50%;box-shadow:0 0 calc(3px + var(--progress)*16px) color-mix(in srgb,var(--accent),transparent 50%);position:relative;background:color-mix(in srgb,var(--accent),transparent 75%)}.sun:before,.sun:after{content:'';position:absolute;inset:-10px;background:repeating-conic-gradient(var(--accent) 0 4deg,transparent 4deg 45deg);mask:radial-gradient(circle,transparent 57%,black 60% 64%,transparent 67%)}.sun:after{inset:-15px;opacity:.4;transform:rotate(22deg)}.focus{width:30px;height:30px;border:1px solid var(--accent);border-radius:50%;box-shadow:0 0 0 5px #ffffff0e,0 0 0 10px #ffffff08;transform:scale(calc(.7 + var(--progress)*.5));transition:transform .2s}.petals{width:36px;height:36px;position:relative;animation:turn 16s linear infinite}.petals i{position:absolute;width:16px;height:23px;background:var(--accent);border-radius:50%;left:10px;top:0;transform-origin:50% 80%;opacity:.75}.petals i:nth-child(2){transform:rotate(72deg)}.petals i:nth-child(3){transform:rotate(144deg)}.petals i:nth-child(4){transform:rotate(216deg)}.petals i:nth-child(5){transform:rotate(288deg)}.meter{width:6px;height:100%;border-radius:9px;background:#fff2;position:relative;overflow:hidden}.meter:after{content:'';position:absolute;bottom:0;left:0;right:0;height:calc(var(--progress)*100%);background:var(--accent);border-radius:9px;transition:height .2s}.leaf{width:22px;height:40px;background:linear-gradient(110deg,var(--accent),color-mix(in srgb,var(--accent),#213a26 40%));border-radius:80% 0 80% 0;transform:rotate(-15deg);animation:breathe 4s ease-in-out infinite}.leaf:after{content:'';position:absolute;left:49%;top:5px;width:1px;height:32px;background:#183c2933;transform:rotate(22deg)}body.horizontal .design{flex-direction:row;width:80%;height:85%;gap:15px}body.horizontal .visual{width:85px;height:32px;max-height:100%}body.horizontal .liquid{width:100%;height:17px}body.horizontal .fill{height:100%;width:calc(var(--progress)*100%);border-radius:8px;transition:width .2s}body.horizontal .meter{height:5px;width:100%}body.horizontal .meter:after{height:100%;width:calc(var(--progress)*100%);right:auto}body.disconnected{opacity:.4}body.disconnected *{animation-play-state:paused!important}@keyframes bubble{50%{transform:translateY(-8px)}}@keyframes wave{50%{transform:scaleY(1)}}@keyframes breathe{50%{transform:rotate(-8deg) scale(1.06)}}@keyframes turn{to{transform:rotate(360deg)}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}
</style></head><body><div class="design"><div class="visual"><div class="bars"><i></i><i></i><i></i><i></i><i></i></div></div><span class="value" id="value">64%</span></div><script>
addEventListener('message', event=>{
 if(event.source!==parent||event.data?.type!=='dentupdate')return;
 const d=event.data.data;
 const progress=Number.isFinite(d.progress)?Math.min(1,Math.max(0,d.progress)):0;
 document.documentElement.style.setProperty('--progress',String(progress));
 document.querySelector('#value').textContent=d.value||d.metrics?.[0]?.value||d.title||'';
 document.body.classList.toggle('horizontal',d.edge==='top'||d.edge==='bottom');
 document.body.classList.toggle('disconnected',d.connected===false);
});
</script></body></html>
